<!DOCTYPE html>
<html lang="en">
<head>
  <title>Invitation Video</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #ffe4e1, #fff0f5);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px 10px;
    }

    /* TOP IMAGE */
    .top-img {
      width: 100%;
      max-width: 450px;
      margin-bottom: 15px;
      object-fit: contain;
    }

    /* MAIN CARD */
    .card {
      background: white;
      padding: 24px 18px;
      border-radius: 24px;
      box-shadow: 0 0 28px rgba(255, 182, 193, 0.7);
      text-align: center;
      width: 100%;
      max-width: 500px;
    }

    .title {
      color: #d63384;
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #555;
      font-size: 15px;
      margin-bottom: 16px;
    }

    /* Video frame */
    .video-frame {
      width: 100%;
      border-radius: 18px;
      border: 6px solid #ffb6c1;
      padding: 4px;
      background: #fff;
    }

    video {
      width: 100%;
      border-radius: 12px;
      display: block;
    }

    .footer {
      margin-top: 16px;
      font-style: italic;
      color: #b03060;
      font-size: 14px;
    }

    /* BOTTOM IMAGE */
    .bottom-img {
      width: 100%;
      max-width: 450px;
      margin-top: 15px;
      object-fit: contain;
    }

    /* Mobile Adjustments */
    @media (max-width: 768px) {
      body {
        padding: 12px 8px;
      }
      
      .card {
        padding: 18px 12px;
        border-radius: 20px;
      }

      .title {
        font-size: 22px;
      }

      .subtitle {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <img src="salwat.png" alt="Top Name" class="top-img">

  <div class="card">
    <div class="title">Wedding Invitation 💖</div>
    <div class="subtitle">A beautiful moment awaits you</div>

    <div class="video-frame">
      <video autoplay playsinline controls muted>
        <source src="friend.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>

    <div class="footer">
      We would be honored by your presence
    </div>
  </div>

  <img src="salwat.png" alt="Bottom Name" class="bottom-img">

</body>
</html>
