<!DOCTYPE html>
<html lang="en">
<head>
  <title>Invitation Video</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      background:black;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    video{
      width:100%;
      max-width:700px;
      border-radius:12px;
    }

    /* overlay button if autoplay blocked */
    .play-btn{
      position:absolute;
      padding:12px 20px;
      background:goldenrod;
      color:white;
      border:none;
      border-radius:10px;
      font-size:16px;
      display:none;
    }
  </style>
</head>

<body>

  <video id="myVideo" playsinline controls>
    <source src="friend.mp4" type="video/mp4">
  </video>

  <button class="play-btn" id="btn">▶ Tap to Play</button>

  <script>
    const video = document.getElementById("myVideo");
    const btn = document.getElementById("btn");

    // try autoplay with sound
    window.addEventListener("load", async () => {
      try {
        video.muted = false;
        await video.play();
      } catch (err) {
        // autoplay blocked → show button
        btn.style.display = "block";
      }
    });

    // manual play fallback
    btn.addEventListener("click", () => {
      video.play();
      btn.style.display = "none";
    });
  </script>

</body>
</html>
