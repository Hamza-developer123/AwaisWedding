<!DOCTYPE html>
<html lang="en">
<head>
  <title>Wedding Invitation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #ffe4e1, #fff0f5);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    /* 🔥 TOP IMAGE BIGGER */
    .top-name {
      width: 200px;
      max-width: 70vw;
      margin-bottom: 15px;
    }

    /* 🔥 CARD CENTER FIX */
    .card {
      width: 100%;
      max-width: 650px;
      background: white;
      padding: 20px;
      border-radius: 22px;
      box-shadow: 0 0 25px rgba(255, 182, 193, 0.7);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ARABIC TEXT */
    .arabic {
      font-family: 'Amiri', serif;
      color: #c0266d;
      font-size: 22px;
      text-align: center;
      direction: rtl;
      margin-bottom: 15px;
      line-height: 1.6;
    }

    /* 🔥 VIDEO FIX (MOST IMPORTANT) */
    video {
      width: 100%;
      max-width: 100%;
      height: auto;
      max-height: 350px;
      border-radius: 16px;
      border: 4px solid #ffb6c1;
      object-fit: cover;
      display: block;
    }

    /* FOOTER */
    .footer {
      margin-top: 12px;
      color: #b03060;
      font-style: italic;
      font-size: 14px;
    }

    /* 🔥 BOTTOM IMAGE BIG + LOWER POSITION */
    .bottom-name {
      width: 220px;
      max-width: 75vw;
      margin-top: 25px;   /* 👈 neeche push */
    }

    /* MOBILE FIX */
    @media (max-width: 768px) {
      .top-name {
        width: 160px;
      }

      .bottom-name {
        width: 170px;
        margin-top: 30px;
      }

      .arabic {
        font-size: 20px;
      }

      video {
        max-height: 260px;
      }
    }
  </style>
</head>

<body>

  <!-- TOP IMAGE -->
  <img src="salwat.png" class="top-name" alt="top">

  <!-- CARD -->
  <div class="card">

    <div class="arabic">
      النِّكَاحُ نِصْفُ الدِّينِ وَهُوَ سَبَبٌ لِلسَّكِينَةِ فِي الْحَيَاةِ
    </div>

    <!-- 🔥 VIDEO FIXED -->
    <video controls autoplay muted playsinline>
      <source src="yourvideo.mp4" type="video/mp4">
      Your browser does not support video.
    </video>

    <div class="footer">
      We would be honored by your presence
    </div>

  </div>

  <!-- BOTTOM IMAGE -->
  <img src="salwat.png" class="bottom-name" alt="bottom">

</body>
</html>
