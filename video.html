<!DOCTYPE html>
<html lang="en">
<head>
  <title>Wedding Invitation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #ffe4e1, #fff0f5);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      text-align: center;
    }

    /* 🔹 TOP & BOTTOM IMAGE FIX */
    .top-name, .bottom-name {
      width: 140px;
      max-width: 45vw;
      display: block;
      margin: 10px auto;
    }

    /* 🔥 MAIN CARD */
    .card {
      width: 100%;
      max-width: 600px;
      background: white;
      padding: 18px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255, 182, 193, 0.7);
    }

    /* 🔹 ARABIC TEXT */
    .arabic {
      font-family: 'Amiri', serif;
      color: #c0266d;
      font-size: 22px;
      line-height: 1.6;
      direction: rtl;
      margin-bottom: 12px;
      padding: 0 5px;
      font-weight: 700;
    }

    /* 🔥 VIDEO FULL FIX */
    video {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 16px;
      border: 4px solid #ffb6c1;
      display: block;
      margin: 10px auto;
    }

    /* FOOTER */
    .footer {
      margin-top: 10px;
      font-style: italic;
      color: #b03060;
      font-size: 14px;
    }

    /* 🔹 MOBILE RESPONSIVE */
    @media (max-width: 768px) {
      .top-name, .bottom-name {
        width: 120px;
      }

      .arabic {
        font-size: 20px;
      }

      video {
        max-height: 250px;
      }
    }
  </style>
</head>

<body>

  <!-- TOP IMAGE -->
  <img src="salwat.png" alt="Top Name" class="top-name">

  <!-- CARD -->
  <div class="card">

    <div class="arabic">
      النِّكَاحُ نِصْفُ الدِّينِ وَهُوَ سَبَبٌ لِلسَّكِينَةِ فِي الْحَيَاةِ
    </div>

    <!-- VIDEO -->
    <video autoplay playsinline controls>
      <source src="yourvideo.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <div class="footer">
      We would be honored by your presence
    </div>

  </div>

  <!-- BOTTOM IMAGE -->
  <img src="salwat.png" alt="Bottom Name" class="bottom-name">

</body>
</html>
