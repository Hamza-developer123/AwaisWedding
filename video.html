<!DOCTYPE html>
<html lang="en">
<head>
  <title>Wedding Invitation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background: linear-gradient(to right, #ffe4e1, #fff0f5);
      font-family: Arial, sans-serif;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:12px;
    }

    /* 🌸 TOP SALAWAT */
    .top-img{
      width:140px;
      max-width:60vw;
      margin:10px 0;
    }

    /* 🌸 CARD FRAME */
    .card{
      width:100%;
      max-width:520px;
      background:white;
      border-radius:22px;
      padding:18px;
      box-shadow:0 0 25px rgba(255,182,193,0.7);
      text-align:center;
    }

    /* 🌸 ARABIC AYAT */
    .arabic{
      font-family:'Amiri', serif;
      font-size:20px;
      color:#c0266d;
      direction:rtl;
      line-height:1.7;
      margin-bottom:12px;
      font-weight:700;
    }

    /* 🌸 VIDEO FRAME */
    video{
      width:100%;
      border-radius:14px;
      border:4px solid #ffb6c1;
      margin:10px 0;
    }

    /* 🌸 FOOTER TEXT */
    .footer{
      font-style:italic;
      color:#b03060;
      font-size:13px;
      margin-top:10px;
    }

    /* 🌸 BOTTOM SALAWAT */
    .bottom-img{
      width:140px;
      max-width:60vw;
      margin-top:18px;
    }

    /* MOBILE FIX */
    @media(max-width:768px){
      .arabic{
        font-size:18px;
      }

      .card{
        padding:14px;
      }

      video{
        border-width:3px;
      }
    }
  </style>
</head>

<body>

  <!-- 🌸 TOP -->
  <img src="salwat.png" class="top-img" alt="top">

  <!-- 🌸 CARD -->
  <div class="card">

    <div class="arabic">
      النِّكَاحُ نِصْفُ الدِّينِ وَهُوَ سَبَبٌ لِلسَّكِينَةِ فِي الْحَيَاةِ
    </div>

    <!-- 🎥 VIDEO -->
    <video id="myVideo" controls playsinline>
      <source src="friend.mp4" type="video/mp4">
    </video>

    <div class="footer">
      We would be honored by your presence
    </div>

  </div>

  <!-- 🌸 BOTTOM -->
  <img src="salwat.png" class="bottom-img" alt="bottom">

  <!-- 🎥 AUTO PLAY FIX SCRIPT -->
  <script>
    const video = document.getElementById("myVideo");

    window.addEventListener("load", async () => {
      try {
        video.muted = false;
        await video.play();
      } catch (e) {
        console.log("Autoplay blocked");
      }
    });
  </script>

</body>
</html>
